appId: com.tableus.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Plans"
    timeout: 30000
- openLink: "tableus://e2e/identity?user=demo-organizer"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Active test identity: Demo Organizer"
    timeout: 30000
- tapOn: "Continue to plans"
- extendedWaitUntil:
    visible: "Plans"
    timeout: 30000
- tapOn: "Plan title"
- inputText: "Offline resilience dinner"
- hideKeyboard
- tapOn: "City, neighborhood, or ZIP code"
- inputText: "Boston, MA"
- hideKeyboard
- tapOn: "Find location"
- extendedWaitUntil:
    visible: "Google Maps"
    timeout: 30000
- tapOn: "Create shared plan"
- extendedWaitUntil:
    visible: ".*may have completed.*"
    timeout: 30000
- assertVisible: "Offline resilience dinner"
- assertVisible: "Retry creating plan"
- takeScreenshot: "offline-retry"
