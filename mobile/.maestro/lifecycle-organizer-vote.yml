appId: com.tableus.app
---
- openLink: "tableus://e2e/identity?user=demo-organizer"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Active test identity: Demo Organizer"
    timeout: 30000
- tapOn:
    text: "Continue to plans"
    retryTapIfNoChange: true
- openLink: "tableus://plans/${PLAN_ID}"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Your constraints"
    timeout: 30000
- tapOn: "Budget, vibe, dietary notes…"
- inputText: "Organizer wants a group friendly dinner"
- tapOn: "Your constraints"
- tapOn: "Save constraints"
- extendedWaitUntil:
    visible: ".*(Constraints saved.|Retry saving constraints).*"
    timeout: 30000
- runFlow:
    when:
      visible: "Retry saving constraints"
    commands:
      - tapOn: "Retry saving constraints"
- extendedWaitUntil:
    visible: "Constraints saved."
    timeout: 30000
- scrollUntilVisible:
    element: "Find four options"
    direction: DOWN
    timeout: 30000
- tapOn: "Find four options"
- extendedWaitUntil:
    visible: ".*(Sakura Table|Retry finding options).*"
    timeout: 30000
- runFlow:
    when:
      visible: "Retry finding options"
    commands:
      - tapOn: "Retry finding options"
- extendedWaitUntil:
    visible: "Sakura Table"
    timeout: 30000
- scrollUntilVisible:
    element: "Rank Sakura Table"
    direction: DOWN
- tapOn:
    text: "Rank Sakura Table"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Remove Sakura Table from rank 1"
    timeout: 10000
- scrollUntilVisible:
    element: "Rank Garden Mezze"
    direction: DOWN
- tapOn:
    text: "Rank Garden Mezze"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Remove Garden Mezze from rank 2"
    timeout: 10000
- scrollUntilVisible:
    element: "Rank Noodle Assembly"
    direction: DOWN
- tapOn:
    text: "Rank Noodle Assembly"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Remove Noodle Assembly from rank 3"
    timeout: 10000
- scrollUntilVisible:
    element: "Trattoria Together"
    direction: DOWN
- assertVisible: "Trattoria Together"
- scrollUntilVisible:
    element: "Submit ranked vote"
    direction: DOWN
- tapOn:
    text: "Submit ranked vote"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element: ".*(Ranked vote saved.|Retry ranked vote).*"
    direction: DOWN
    timeout: 30000
- runFlow:
    when:
      visible: "Retry ranked vote"
    commands:
      - tapOn: "Retry ranked vote"
- scrollUntilVisible:
    element: "Ranked vote saved."
    direction: DOWN
    timeout: 30000
- assertVisible: "Finalize current winner"
