appId: com.tableus.app
---
- launchApp:
    clearState: true
- openLink: "tableus://e2e/identity?user=demo-organizer"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Active test identity: Demo Organizer"
    timeout: 30000
- tapOn: "Continue to plans"
- extendedWaitUntil:
    visible: "Plans"
    timeout: 30000
- tapOn: "Friday dinner"
- inputText: "Mobile lifecycle dinner"
- hideKeyboard
- tapOn: "Create shared plan"
- extendedWaitUntil:
    visible: "Friday dinner"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Mobile lifecycle dinner.*"
    timeout: 30000
- assertNotVisible: "Authentication required"
