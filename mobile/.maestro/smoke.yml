appId: com.tableus.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Plans"
    timeout: 60000
- assertNotVisible: "Authentication required"
- tapOn: "Friday dinner"
- inputText: "Beta dinner"
- hideKeyboard
- tapOn: "Create shared plan"
- extendedWaitUntil:
    visible: "Friday dinner"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Beta dinner.*"
    timeout: 30000
- assertNotVisible: "Authentication required"
- tapOn: ".*Beta dinner.*"
- extendedWaitUntil:
    visible: "Your constraints"
    timeout: 30000
