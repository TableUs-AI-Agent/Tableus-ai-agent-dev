appId: com.tableus.app
---
- openLink: "tableus://e2e/identity?user=demo-guest"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Active test identity: Demo Guest"
    timeout: 30000
- tapOn:
    text: "Continue to plans"
    retryTapIfNoChange: true
- openLink: "tableus://join/${PLAN_ID}?token=${SHARE_TOKEN}"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Join this TableUs plan?"
    timeout: 30000
- tapOn: "Join this plan"
- extendedWaitUntil:
    visible: "This private link is invalid, expired, or has been rotated."
    timeout: 30000
- takeScreenshot: "rotated-link"
