appId: com.tableus.app
---
- openLink: "tableus://account"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Account and data"
    timeout: 30000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Invite access"
    timeout: 30000
- assertNotVisible: "Plans"
