appId: com.tableus.app
---
- launchApp
- openLink: "tableus:///auth"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Invite access|Plans"
    timeout: 60000
- runFlow:
    when:
      visible: "Plans"
    commands:
      - openLink: "tableus:///account"
      - runFlow:
          when:
            visible: ".*Open in.*TableUs.*"
          commands:
            - tapOn: "Open"
      - extendedWaitUntil:
          visible: "Account and data"
          timeout: 30000
      - tapOn: "Sign out"
      - extendedWaitUntil:
          notVisible: "Account and data"
          timeout: 60000
      - openLink: "tableus:///auth"
      - runFlow:
          when:
            visible: ".*Open in.*TableUs.*"
          commands:
            - tapOn: "Open"
- extendedWaitUntil:
    visible: "Invite access"
    timeout: 60000
- tapOn: "Already joined? Sign in"
- extendedWaitUntil:
    visible: "Email address"
    timeout: 30000
