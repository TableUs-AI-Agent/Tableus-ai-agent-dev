appId: com.tableus.app
---
- tapOn: "Email verification code"
- inputText: "${MAESTRO_OTP}"
- tapOn: "Verification email"
- tapOn: "Verify and continue"
- openLink: "tableus:///"
- runFlow:
    when:
      visible: ".*Open in.*TableUs.*"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Plans"
    timeout: 60000
- assertNotVisible: "Invite access"
- takeScreenshot: "returning-session"
