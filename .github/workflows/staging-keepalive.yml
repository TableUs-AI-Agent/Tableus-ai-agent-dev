name: Staging keepalive

# Supabase pauses Free-plan projects after a week without activity. A daily
# database query through the staging API and one Supabase Auth request keep
# "TableUs Staging" awake during the friends test. Delete this when staging
# moves to a paid plan or is retired.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the staging database through the API
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 https://api-staging-3795.up.railway.app/health/ready
      - name: Call Supabase Auth
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 --output /dev/null https://mrwdhdeubdiiydmmvlda.supabase.co/auth/v1/.well-known/jwks.json
