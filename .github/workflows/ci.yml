name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tableus
          POSTGRES_PASSWORD: tableus
          POSTGRES_DB: tableus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tableus -d tableus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tableus:tableus@127.0.0.1:5432/tableus_test
      TABLEUS_AUTH_MODE: demo
      TABLEUS_PROVIDER_MODE: deterministic
      TABLEUS_DEMO_MODE: true
      TABLEUS_APP_SECRET: ci-only-secret-that-is-longer-than-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: npm run lint
      - run: npm run typecheck
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy tableus
        working-directory: backend
      - run: npm run test
      - run: uv run pytest
        working-directory: backend
      - run: uv run python scripts/ai_eval.py
        working-directory: backend
      - run: uv run python scripts/export_openapi.py
        working-directory: backend
      - run: npm run contract:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: uv run python scripts/smoke.py
        working-directory: backend
