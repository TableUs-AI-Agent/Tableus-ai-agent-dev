name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: tableus
          POSTGRES_PASSWORD: tableus
          POSTGRES_DB: tableus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tableus -d tableus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://tableus_runtime:ci-local-only@127.0.0.1:5432/tableus_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://tableus:tableus@127.0.0.1:5432/tableus_test
      TABLEUS_RUNTIME_DB_ROLE: tableus_runtime
      TABLEUS_AUTH_MODE: demo
      TABLEUS_PROVIDER_MODE: deterministic
      TABLEUS_DEMO_MODE: true
      TABLEUS_APP_SECRET: ci-only-secret-that-is-longer-than-thirty-two-bytes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - name: Prepare disposable PostgreSQL roles
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio
          import asyncpg
          async def prepare():
              connection = await asyncpg.connect("postgresql://tableus:tableus@127.0.0.1:5432/tableus_test")
              try:
                  await connection.execute("CREATE ROLE tableus_runtime LOGIN PASSWORD 'ci-local-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT")
                  await connection.execute("CREATE ROLE anon NOLOGIN NOSUPERUSER")
                  await connection.execute("CREATE ROLE authenticated NOLOGIN NOSUPERUSER")
              finally:
                  await connection.close()
          asyncio.run(prepare())
          PY
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: npm run lint
      - run: npm run typecheck
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy tableus
        working-directory: backend
      - run: npm run test
      - run: uv run pytest
        working-directory: backend
      - run: uv run python scripts/ai_eval.py
        working-directory: backend
      - run: uv run python scripts/export_openapi.py
        working-directory: backend
      - run: npm run contract:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: uv run python scripts/smoke.py
        working-directory: backend
